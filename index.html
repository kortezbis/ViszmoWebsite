    gtag('js', new Date());

    gtag('config', 'G-P4VHMSN0DC');

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png.png" />
  <link rel="apple-touch-icon" href="/viszmofull.png" />
  <link rel="shortcut icon" href="/favicon-32x32.png.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Preload Critical Fonts -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Plus+Jakarta+Sans:wght@700;800&family=Kalam:wght@700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Plus+Jakarta+Sans:wght@700;800&family=Kalam:wght@700&display=swap"></noscript>
  
  <!-- Preload Hero Background Image -->
  <link rel="preload" href="/hero-background.jpg.png" as="image" fetchpriority="high">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Kalam:wght@300;400;700&display=swap"
    rel="stylesheet">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches === true;
        if (!theme && supportDarkMode) theme = 'dark';
        if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#111112';
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#ffffff';
        }
      } catch (e) {}
    })();
  </script>
  <title>Viszmo - Your Study Sidekick</title>
</head>

<body style="margin: 0; padding: 0;">
  <div id="root" style="min-height: 100vh;"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
